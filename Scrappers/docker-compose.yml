services:
  # 1. Serwer HTTP (tak jak działa na GCP Cloud Functions)
  scraper-server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env

  # 2. Szybki test pojedynczego skryptu
  scraper-test:
    build: .
    env_file:
      - .env
    command: python googlescrap.py
    volumes:
      - .:/workspace  # Przekazuje kod 'na żywo' - zmiana w pliku działa od razu bez rebuildowania!???????
  main-test:
    build: .
    env_file:
      - .env
    command: python main.py
    volumes:
      - .:/workspace  # Przekazuje kod 'na żywo' - zmiana w pliku działa od razu bez rebuildowania!???????
  small-main-test:
    build: .
    env_file:
      - .env
    command: python -c "from main import generate_weekly_tasks; generate_weekly_tasks();"
    volumes:
      - .:/workspace  # Przekazuje kod 'na żywo' - zmiana w pliku działa od razu bez rebuildowania!???????